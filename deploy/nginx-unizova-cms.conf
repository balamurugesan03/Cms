# Add inside the existing  server { server_name unizova.com; listen 443 ssl; ... }  block.
# The Node app already serves everything under /cms (BASE_PATH=/cms), so no path rewriting is needed.

location = /cms { return 301 /cms/; }

location /cms/ {
    proxy_pass         http://127.0.0.1:5000;   # no trailing slash: keeps the /cms prefix
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 25m;               # file uploads (app limit is 20MB)
    proxy_read_timeout 60s;
}
